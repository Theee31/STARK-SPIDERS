<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaon Saathi – गाँव साथी</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#1d1a14;--mut:#5b5446;--pri:#b45309;--pri-ink:#fff;--grn:#166534;--grnbg:#dcfce7;--red:#b91c1c;--redbg:#fee2e2;--amb:#854d0e;--ambbg:#fef3c7;--blu:#1e40af;--blubg:#dbeafe;--bd:#e7dcc3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130c;--card:#241e13;--ink:#fdf6e6;--mut:#c9bd9f;--pri:#f59e0b;--pri-ink:#1d1a14;--grn:#86efac;--grnbg:#14391f;--red:#fca5a5;--redbg:#4a1818;--amb:#fde68a;--ambbg:#45330c;--blu:#93c5fd;--blubg:#16294f;--bd:#4a3f2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130c;--card:#241e13;--ink:#fdf6e6;--mut:#c9bd9f;--pri:#f59e0b;--pri-ink:#1d1a14;--grn:#86efac;--grnbg:#14391f;--red:#fca5a5;--redbg:#4a1818;--amb:#fde68a;--ambbg:#45330c;--blu:#93c5fd;--blubg:#16294f;--bd:#4a3f2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",Roboto,sans-serif}
body.saral{font-size:21px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:48px;border-radius:12px;border:2px solid var(--bd);background:var(--card);padding:8px 14px;font-weight:600}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
a{color:var(--blu)}
.util{background:#2b1d06;color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;position:sticky;top:0;z-index:5}
.util select{min-height:44px;border-radius:10px;padding:0 8px;background:#fff;color:#1d1a14;border:0}
.util button{min-height:44px;background:#3d2c0d;color:#fff;border-color:#6b4f17}
.util .sos{background:#b91c1c;border-color:#fecaca;margin-left:auto}
.util .logo{font-weight:800;font-size:1.1rem}
nav.main{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:2px solid var(--bd)}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;min-height:44px;display:flex;gap:6px;align-items:center}
nav.main a[aria-current=page]{background:var(--pri);color:var(--pri-ink)}
main{max-width:980px;margin:0 auto;padding:14px 12px 60px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mut);font-size:.9rem;margin-bottom:10px}
.crumbs a{color:var(--mut)}
h1{font-size:1.6rem;margin:.3em 0}h2{font-size:1.25rem;margin:1em 0 .4em}h3{margin:.2em 0}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:130px;text-align:center;text-decoration:none;color:var(--ink);background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px;font-weight:800;font-size:1.1rem}
.tile .ic{font-size:2.6rem}.tile small{font-weight:500;color:var(--mut)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:800;border:1.5px solid currentColor}
.b-v{color:var(--grn);background:var(--grnbg)}.b-n{color:var(--amb);background:var(--ambbg)}.b-d{color:var(--blu);background:var(--blubg)}
.alert{background:var(--redbg);color:var(--red);border:2px solid var(--red);border-radius:14px;padding:10px 14px;font-weight:700}
.good{color:var(--grn);font-weight:800}.warn{color:var(--red);font-weight:800}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:10px;text-align:center;font-weight:700;font-size:.95rem}
.step b{display:block;font-size:1.6rem}
.search{display:flex;gap:8px;flex-wrap:wrap}.search input{flex:1;min-width:180px;min-height:54px;border-radius:14px;border:3px solid var(--pri);padding:0 14px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;min-height:56px;font-size:1.05rem}
ul.chk{list-style:none;padding:0}ul.chk li::before{content:"✅ "}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.guide{background:var(--ambbg);color:var(--amb);border:2px dashed var(--amb);border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:600}
.call{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;background:var(--red);border-radius:16px;padding:14px;min-height:72px;font-weight:800;font-size:1.2rem}
.call small{display:block;font-weight:500;opacity:.9}
body.saral .hide-s{display:none}
input.f{min-height:48px;border:2px solid var(--bd);border-radius:10px;padding:0 10px;background:var(--card);width:100%;margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d1a14;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:9}
.hero{border-radius:16px;overflow:hidden;border:2px solid var(--bd);margin:4px 0 10px}.hero svg{display:block;width:100%;height:auto}
.art{width:72px;height:72px;flex:none}.step .art{display:block;width:64px;height:64px;margin:0 auto 4px}
body.saral .art{width:84px;height:84px}
@media(max-width:480px){.steps{grid-template-columns:1fr}}
</style></head>

const toast=m=>{const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)};
const speak=txt=>{if(!("speechSynthesis" in window))return toast("Read-aloud not supported");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=hi()?"hi-IN":"en-IN";speechSynthesis.speak(u)};
const readBtn=()=>`<button onclick="speak(document.getElementById('app').innerText)">${t("listen")}</button>`;
const NAV=[["home","🏠","home"],["schemes","📋","schemes"],["docs","🗂️","docs"],["services","🧰","services"],["emergency","🚨","emergency"],["saved","★","saved"]];
const route=()=>(location.hash.slice(1)||"home");
function crumbs(r){const m={schemes:"schemes",finder:"finder",docs:"docs",services:"services",agri:"agri",jobs:"jobs",nearby:"nearby",emergency:"emergency",saved:"saved"};let c=[`<a href="#home">${t("home")}</a>`];
 if(r.startsWith("scheme-")){c.push(`<a href="#schemes">${t("schemes")}</a>`,pick(S.find(x=>"scheme-"+x.id===r).n))}
 else if(["agri","jobs","nearby"].includes(r)){c.push(`<a href="#services">${t("services")}</a>`,t(m[r]))}
 else if(r==="journey-student"||r==="journey-farmer")c.push(t("journeys"));
 else if(r!=="home")c.push(t(m[r]||r));
 return `<div class="crumbs">${r!=="home"?`<button onclick="history.back()">${t("back")}</button>`:""}${c.join(" › ")}</div>`}
function head(ic,title){return `<div class="row sp"><h1>${ic} ${title}</h1>${readBtn()}</div>`}
function render(){
 document.documentElement.lang=hi()?"hi":"en";document.body.classList.toggle("saral",st.saral);
 const r=route();
 $("#nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" ${(r===n[0]||(n[0]==="services"&&["agri","jobs","nearby"].includes(r))||(n[0]==="schemes"&&(r==="finder"||r.startsWith("scheme-"))))?'aria-current="page"':""}>${n[1]} ${t(n[2])}</a>`).join("");
 $("#lang").innerHTML=LANGS.map(l=>`<option value="${l[0]}" ${l[0]===st.lang?"selected":""}>${l[1]}</option>`).join("");
 $("#saralBtn").textContent=st.saral?"✅ "+t("saralOn"):"🟠 "+t("saral");$("#saralBtn").setAttribute("aria-pressed",st.saral);
 let h=crumbs(r);
 if(st.saral&&r!=="home")h+=`<div class="guide">👉 ${t("assist")}</div>`;
 h+=(V[r]||(r.startsWith("scheme-")?V.detail:V.home))(r);
 app.innerHTML=h;window.scrollTo(0,0);app.focus({preventScroll:true});

const tile=(href,ic,lbl,sub="")=>`<a class="tile" href="#${href}"><span class="ic" aria-hidden="true">${ic}</span>${lbl}${sub?`<small>${sub}</small>`:""}</a>`;

window.mic=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(t("nomic"));$("#q").focus();return}
 const r=new SR();r.lang=hi()?"hi-IN":"en-IN";r.onresult=e=>{st.q=e.results[0][0].transcript;if(route()==="schemes"){render()}else{$("#q").value=st.q;go()}};r.onerror=()=>toast(t("nomic"));$("#mic").textContent="🎙️ …";r.start()};
$("#lang").onchange=e=>{st.lang=e.target.value;if(["bho","mai","bn","ta","te","mr"].includes(st.lang))toast(UI.hi.pending);save();render()};
$("#saralBtn").onclick=()=>{st.saral=!st.saral;save();render()};
$("#themeBtn").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme==="dark";d.dataset.theme=dark?"light":"dark"};
addEventListener("hashchange",render);render();
</script></body></html>
